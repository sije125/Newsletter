<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>AI Money-Making Agent</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-zCbKRCUGaJDkqS1kPbPd7TveP5iyJE0EjAuZQTgFLD2ylzuqKfdKlfG/eSrtxUkn"
      crossorigin="anonymous"
    />
    <link href="css/agent.css" rel="stylesheet" />
  </head>
  <body>
    <div class="agent-wrap">
      <h1 class="h3 mb-1">Niche Finder</h1>
      <p class="text-muted">
        An AI interview that digs through your skills and interests to find a real way to make
        money online with AI &mdash; and the niche + method to go after first.
      </p>

      <div id="chat" class="chat-box"></div>

      <form id="chat-form" class="chat-form">
        <input
          id="chat-input"
          type="text"
          class="form-control"
          placeholder="Type your answer..."
          autocomplete="off"
          autofocus
        />
        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </div>

    <script src="js/agent.js"></script>
  </body>
</html>
